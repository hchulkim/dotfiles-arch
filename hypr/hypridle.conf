general {
    lock_cmd = pidof hyprlock || hyprlock       # command to run when locking
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on screen after suspend
}

listener {
    timeout = 600                                # 10 minutes
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 900                                
    on-timeout = hyprctl dispatch dpms off       # turn off screen
    on-resume = hyprctl dispatch dpms on         # screen on when activity
}

# suspend the system 30min
listender {
	timeout = 1800
	on-timeout = systemctl suspend
}
